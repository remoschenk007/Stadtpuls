name: Stadtpuls Daten-Sync (Eventfrog + Zürich Tourismus)

on:
  schedule:
    - cron: '0 4 * * *'      # täglich 04:00 UTC (~06:00 Zürich)
  workflow_dispatch: {}       # + manuell im Actions-Tab auslösbar

permissions:
  contents: write            # damit der Bot Seiten/Sitemap zurueck ins Repo committen darf

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # volli History, damit git pull --rebase zuverlässig lauft
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Events auffrischen (Eventfrog → eventfrog_events)
        run: python import_eventfrog.py
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Locations auffrischen (Zürich Tourismus → locations)
        run: python import_locations.py
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Event-Seiten generieren (SP_PRETTY v1 — huebsche URLs)
        run: python generate_event_pages.py
      - name: Lokal-Seiten generieren (SP_PRETTY_LOC v1 — Gastro + Shopping)
        run: python generate_location_pages.py
      - name: Kreis-Landingpages generieren
        run: python generate_kreis_pages.py
      - name: Sitemap generieren
        run: python generate_sitemap.py
      - name: Änderungen committen & pushen
        run: |
          git config user.name "Stadtpuls Bot"
          git config user.email "bot@depuls.ch"
          git add -A
          if git diff --staged --quiet; then
            echo "Kei Änderige — nüt z pushe."
          else
            git commit -m "Auto: Event-Seiten, Kreis-Seiten, Sitemap aktualisiert [skip ci]"
            # Zerscht de neuscht Stand vom Remote hole (mir pushed dä Tag viel parallel),
            # dänn erst pushe — verhinderet non-fast-forward-Fehler.
            git pull --rebase --autostash origin main
            git push
          fi
