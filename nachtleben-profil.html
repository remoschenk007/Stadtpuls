.btw{border-top:1px solid rgba(255,45,0,.07);margin-top:56px;overflow:hidden;background:#000}

footer{padding:44px 40px 32px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:40px;border-top:1px solid rgba(255,45,0,.08);background:#000}

.fc-link{display:block;font-size:10px;color:rgba(232,228,217,.2);margin-bottom:8px;transition:.15s;text-decoration:none;cursor:none}

.fc-desc{font-size:10px;color:rgba(232,228,217,.15);line-height:1.9;margin-top:8px}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
@keyframes tL{from{transform:translateX(0)}to{transform:translateX(-50%)}}

footer{padding:24px 16px;grid-template-columns:1fr 1fr;gap:14px}}
</style>

<script>
const SU='https://pnynkzrqnfoshojqfqxn.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBueW5renJxbmZvc2hvanFmcXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTg3NDEsImV4cCI6MjA5MTI5NDc0MX0.W3cOPU7lQKimHIYPc7ISuZGmOeV20GB3DEW-QdDJXZQ';
const SUBKAT={162:{e:'🌙',n:'NACHTLEBEN'},1414:{e:'🔊',n:'TECHNO'},1417:{e:'🎤',n:'HIP-HOP'},1423:{e:'🎸',n:'ROCK'},1426:{e:'💃',n:'LATIN'},1429:{e:'🌅',n:'AFTERHOUR'},1432:{e:'🎷',n:'JAZZ'},1435:{e:'🎉',n:'PARTY'},163:{e:'🎸',n:'LIVE MUSIC'},103:{e:'🍸',n:'BAR'},1438:{e:'🍹',n:'COCKTAILBAR'},1441:{e:'🎵',n:'MUSIC BAR'},1444:{e:'🍺',n:'PUB'},1447:{e:'🍽️',n:'RESTAURANT-BAR'}};
const DAYS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const VIBES=['«Hüt Nacht isch genau de richtige Club für dich.»','«Kreis 4 feueret — sicher nöd hei gah.»','«Afterhour bis 8 Uhr — nur für Nachtvögel.»','«Stimmig passt — geh hüt Nacht.»','«Techno at its finest — Züri Style.»'];

function isOffe(oz){if(!oz||!Array.isArray(oz))return false;const now=new Date();const h=now.getHours();const day=DAYS[now.getDay()];const s=oz.find(o=>o&&o.includes(day));if(!s)return false;const m=s.match(/(\d{2}):(\d{2}):00-(\d{2}):(\d{2}):00/);if(!m)return false;return h>=parseInt(m[1])&&h<parseInt(m[3]);}
function getVibe(sid){if([1414,1429].includes(sid))return 5;if([1435,1417,1426].includes(sid))return 4;if([1432,163,1441].includes(sid))return 3;return 2;}

async function loadProfil(){
  const p=new URLSearchParams(window.location.search);
  const id=p.get('id'),slug=p.get('slug');
  if(!id&&!slug){showError('Kein Club angegeben');return;}
  try{
    const q='locations?select=*&limit=1&aktiv=eq.true'+(id?`&id=eq.${id}`:`&slug=eq.${slug}`);
    const r=await fetch(SU+'/rest/v1/'+q,{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
    const data=await r.json();
    if(!data?.length){showError('Club nöd gfunde');return;}
    renderProfil(data[0]);
    const sid=parseInt(data[0].zt_subkategorie_id)||0;
    const kreis=data[0].kreis||1;
    const subkat=(data[0].subkategorie||'').toLowerCase();
    let simData=[];
    // 1. Gleiche zt_subkategorie_id
    if(sid){
      const sr1=await fetch(SU+`/rest/v1/locations?select=id,name,slug,zt_subkategorie_id,subkategorie,kreis,bild_url&aktiv=eq.true&zt_subkategorie_id=eq.${sid}&id=neq.${data[0].id}&limit=6`,{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
      simData=await sr1.json()||[];
    }
    // 2. Gleiche subkategorie Text
    if(!simData.length&&subkat){
      const sr2=await fetch(SU+`/rest/v1/locations?select=id,name,slug,zt_subkategorie_id,subkategorie,kreis,bild_url&aktiv=eq.true&subkategorie=eq.${subkat}&id=neq.${data[0].id}&limit=6`,{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
      simData=await sr2.json()||[];
    }
    // 3. Fallback: kategorie=nachtleben
    if(!simData.length){
      const sr3=await fetch(SU+`/rest/v1/locations?select=id,name,slug,zt_subkategorie_id,subkategorie,kreis,bild_url&aktiv=eq.true&kategorie=eq.nachtleben&id=neq.${data[0].id}&limit=6`,{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
      simData=await sr3.json()||[];
    }
    renderSimilar(simData,sid,subkat);
  }catch(e){showError('Verbindungsfehler');}
}

function renderProfil(l){
  const sid=parseInt(l.zt_subkategorie_id)||0;
  const sub=SUBKAT[sid]||{e:'🌙',n:'NACHTLEBEN'};
  const offe=isOffe(l.oeffnungszeiten);
  const vibe=getVibe(sid);
  const isAfter=sid===1429;
  const rating=l.rating||4.1;
  const today=new Date().getDay();
  const oz=l.oeffnungszeiten||[];

  document.title=`${l.name} — Nachtleben Zürich | Stadtpuls`;

  const ozHtml=DAYS.map((d,i)=>{
    const s=oz.find(o=>o&&o.includes(d));
    const m=s?s.match(/(\d{2}):(\d{2}):00-(\d{2}):(\d{2}):00/):null;
    const isToday=i===today;
    return`<div class="oz-row${isToday?' today':''}${!m?' oz-closed':''}">
      <div class="oz-day">${d}${isToday?' ◀':''}</div>
      <div class="oz-time">${m?m[1]+':'+m[2]+' – '+m[3]+':'+m[4]:'GESCHLOSSEN'}</div>
    </div>`;
  }).join('');

  const vibeDots=[1,2,3,4,5].map(v=>`<div class="vdot${v<=vibe?' on'+(v>=5?' anim':''):''}"></div>`).join('');

  document.getElementById('main-content').innerHTML=`
    <div class="hero-img-wrap">
      ${l.bild_url?`<img class="hero-img" src="${l.bild_url}" alt="${l.name}">`:`<div style="height:280px;background:#050000;display:flex;align-items:center;justify-content:center;font-size:80px;opacity:.1">${sub.e}</div>`}
      <div class="offe-badge ${offe?'is-offe':'is-zu'}">
        ${offe?'<div class="offe-dot"></div>':''}
        <span>${offe?'JETZT OFFE':'MOMENTAN GESCHLOSSEN'}</span>
      </div>
    </div>

    <div class="profil-head">
      <div class="ph-left">
        <div class="ph-badges">
          ${l.featured?'<span class="phb volt">TOP</span>':''}
          ${isAfter?'<span class="phb gold">🌅 AFTERHOUR</span>':''}
          <span class="phb red">${sub.e} ${sub.n}</span>
          <span class="phb ghost">KREIS ${l.kreis||'?'}</span>
          ${offe?'<span class="phb offe-b"><div class="bdot"></div>OFFE</span>':''}
        </div>
        <div class="ph-name">${l.name}</div>
        <div class="ph-genre">${sub.n} · KREIS ${l.kreis||'?'}</div>
        <div class="ph-adresse">${l.adresse||''}${l.plz?' · '+l.plz+' Zürich':''}</div>
      </div>
      <div class="ph-right">
        <div class="ph-rating">${rating.toFixed(1)}</div>
        <div class="ph-stars">${'★'.repeat(Math.min(5,Math.round(rating)))}</div>
        <div class="ph-rlabel">SCORE</div>
      </div>
    </div>

    <div class="vibe-strip">
      <div class="vibe-lbl">VIBE</div>
      <div class="vibe-dots">${vibeDots}</div>
      ${vibe>=5?'<div style="font-size:8px;color:#ff2d00;letter-spacing:1.5px;text-transform:uppercase;margin-left:8px;text-shadow:0 0 10px rgba(255,45,0,.5)">🔥 ON FIRE</div>':''}
    </div>

    <div class="main">
      <div class="content">
        <div class="ki-pred">
          <div class="ki-pred-head"><span style="font-size:16px">🤖</span><span class="ki-pred-label">ZÜRI-BOT SAIT</span></div>
          <div class="ki-pred-txt">⚡ «${VIBES[Math.floor(Math.random()*VIBES.length)]}»</div>
        </div>

        ${l.beschreibung||l.beschreibung_kurz?`
        <div class="c-section">
          <div class="c-title">ÜBER DE CLUB</div>
          <div class="c-desc">${l.beschreibung||l.beschreibung_kurz}</div>
        </div>`:''}

        <div class="c-section">
          <div class="c-title">ÖFFNIGSZITE</div>
          <div class="oz-wrap">${ozHtml}</div>
        </div>

        <div class="c-section">
          <div class="c-title">ÄHNLICHI CLUBS</div>
          <div class="ae-grid" id="ae-grid">
            <div style="grid-column:1/-1;padding:20px;text-align:center;font-size:9px;color:rgba(232,228,217,.12)">LÄDT...</div>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <!-- TICKET BTN — nur wenn ticketcorner_url oder event vorhanden -->
        ${l.ticketcorner_url?`
        <a class="btn-ticket" href="${l.ticketcorner_url}" target="_blank">
          🎫 TICKET KAUFE → TICKETCORNER
        </a>`:''}

        <!-- TISCHRESERVIERUNG — nur wenn reservierbar=true -->
        ${l.reservierbar?`
        <a class="btn-ticket" href="https://www.opentable.com/s/?term=${encodeURIComponent(l.name)}+Zürich" target="_blank" style="background:#c8ff00;color:#000;box-shadow:0 0 20px rgba(200,255,0,.2)">
          🍽️ TISCH RESERVIERE →
        </a>`:''}

        <a class="btn-ghost" href="${l.website||'#'}" target="_blank">🌐 WEBSITE ÖFFNE →</a>
        <a class="btn-ghost" href="nachtleben.html">← ZURÜCK ZUM NACHTLEBEN</a>

        <div class="info-card">
          <div class="ic-title">INFOS</div>
          ${l.adresse?`<div class="ir"><div class="ir-l">ADRESSE</div><div class="ir-r">${l.adresse}</div></div>`:''}
          <div class="ir"><div class="ir-l">KREIS</div><div class="ir-r red">Kreis ${l.kreis||'?'}</div></div>
          <div class="ir"><div class="ir-l">GENRE</div><div class="ir-r">${sub.e} ${sub.n}</div></div>
          <div class="ir"><div class="ir-l">STATUS</div><div class="ir-r ${offe?'volt':''}">${offe?'● JETZT OFFE':'MOMENTAN ZU'}</div></div>
          ${isAfter?`<div class="ir"><div class="ir-l">AFTERHOUR</div><div class="ir-r" style="color:#ffd700">🌅 JA</div></div>`:''}
          <div class="ir"><div class="ir-l">RATING</div><div class="ir-r red">${rating.toFixed(1)} ★</div></div>
          ${l.website?`<div class="ir"><div class="ir-l">WEBSITE</div><div class="ir-r"><a href="${l.website}" target="_blank">ÖFFNE →</a></div></div>`:''}
          ${l.telefon?`<div class="ir"><div class="ir-l">TEL</div><div class="ir-r">${l.telefon}</div></div>`:''}
        </div>

        <div class="action-grid">
          <div class="act-btn">🗺️ KARTE</div>
          <div class="act-btn">❤️ SPEICHERE</div>
          <div class="act-btn">⭐ BEWERTE</div>
          <div class="act-btn">📤 TEILE</div>
        </div>
      </div>
    </div>`;
}

function renderSimilar(locs,sid,subkat){
  const g=document.getElementById('ae-grid');if(!g)return;
  // Sub-Info aus ID oder Text
  const sub=SUBKAT[sid]||(subkat?{e:'🌙',n:subkat.toUpperCase()}:{e:'🌙',n:'NACHTLEBEN'});
  if(!locs?.length){g.innerHTML='<div style="grid-column:1/-1;padding:20px;text-align:center;font-size:9px;color:rgba(232,228,217,.12)">NÜÜT GFUNDE</div>';return;}
  g.innerHTML=locs.slice(0,6).map(l=>{
    const lsub=SUBKAT[parseInt(l.zt_subkategorie_id)]||(l.subkategorie?{e:'🌙',n:l.subkategorie.toUpperCase()}:{e:'🌙',n:'NACHTLEBEN'});
    return`<div class="ae-card" onclick="window.location='nachtleben-profil.html?id=${l.id}'">
      ${l.bild_url?`<img class="ae-img" src="${l.bild_url}" loading="lazy" alt="${l.name}">`:`<div class="ae-ph">${lsub.e}</div>`}
      <div class="ae-name">${l.name}</div>
      <div class="ae-sub">${lsub.n}</div>
      <div class="ae-kr">K${l.kreis||'?'}</div>
    </div>`;
  }).join('');
}

function showError(msg){
  document.getElementById('main-content').innerHTML=`<div class="load-wrap"><div style="font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:48px;color:rgba(255,45,0,.15);text-transform:uppercase;margin-bottom:10px">FEHLER</div><div style="font-size:10px;color:rgba(232,228,217,.2)">${msg}</div><a href="nachtleben.html" style="display:inline-block;margin-top:20px;font-size:9px;letter-spacing:2px;color:#ff2d00;border:1px solid rgba(255,45,0,.3);padding:10px 18px;text-decoration:none">← NACHTLEBEN</a></div>`;
}

const cur=document.getElementById('cur'),cur2=document.getElementById('cur2');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';cur2.style.left=e.clientX+'px';cur2.style.top=e.clientY+'px';});

const TI=['ZÜRI SCHLAFT NÖD','TECHNO · HOUSE · JAZZ','LANGSTRASSE FEUERT','KREIS 4','4. JUNI 2026'];
const TIG=['KOMPLEX 457','ROTE FABRIK','AFTERHOUR ZÜRICH','BY RAIMONDO*','STADTPULS'];
['ta','tb'].forEach((id,i)=>{const t=document.getElementById(id);if(!t)return;const items=i===0?TI:TIG;t.innerHTML=[...items,...items].map(x=>`<span class="ti"><b>●</b> ${x}</span>`).join('');});

loadProfil();
</script>
</body>
</html>
