<!DOCTYPE html>
<html lang="de">
<head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Zürich | Stadtpuls</title>
<meta name="description" content="Event Details — Tickets, Karte, Bewertungen, Community.">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#04040a;color:#e8e4d9;font-family:'DM Mono',monospace;min-height:100vh;cursor:none;overflow-x:hidden}
#cur{position:fixed;width:8px;height:8px;background:#ff2d00;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
#cur2{position:fixed;width:24px;height:24px;border:1px solid rgba(255,45,0,.5);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:left .08s,top .08s}
.scan{position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0,rgba(0,0,0,.025) 1px,transparent 1px,transparent 2px);pointer-events:none;z-index:500}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid #1a1a2e;position:sticky;top:0;background:rgba(4,4,10,.95);backdrop-filter:blur(12px);z-index:200}
.logo{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:22px;color:#ff2d00;letter-spacing:2px;text-decoration:none}
.nav-back{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555;text-decoration:none;transition:color .2s;display:flex;align-items:center;gap:8px}
.nav-back:hover{color:#e8e4d9}

/* ═══ HERO FULLBLEED ═══ */
.hero{position:relative;height:75vh;min-height:420px;overflow:hidden;background:#04040a}
.hero-img{width:100%;height:100%;object-fit:cover;filter:grayscale(10%);display:block}
.hero-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:140px;color:#111;background:linear-gradient(135deg,#04040a,#0a0a14)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(0deg,#04040a 0%,rgba(4,4,10,.7) 35%,rgba(4,4,10,.1) 100%)}

/* FLOATING TIME */
.hero-time{position:absolute;top:24px;right:28px;background:#ff2d00;padding:14px 22px;z-index:3}
.ht-h{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:52px;color:#fff;line-height:1;display:block}
.ht-l{font-size:7px;letter-spacing:3px;color:rgba(255,255,255,.7);display:block;text-align:center;text-transform:uppercase;margin-top:2px}

/* LIVE NOW BADGE */
.live-badge{position:absolute;top:24px;left:28px;display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(200,255,0,.1);border:1px solid rgba(200,255,0,.3);z-index:3}
.live-dot{width:7px;height:7px;background:#c8ff00;border-radius:50%;animation:ping 1.5s infinite;flex-shrink:0}
.live-txt{font-size:8px;letter-spacing:3px;color:#c8ff00;text-transform:uppercase}

/* SOLD OUT */
.soldout-badge{position:absolute;top:24px;left:28px;display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(255,45,0,.15);border:1px solid rgba(255,45,0,.4);z-index:3}
.soldout-txt{font-size:8px;letter-spacing:3px;color:#ff2d00;text-transform:uppercase}

/* HERO CONTENT */
.hero-content{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:0 40px 32px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hc{padding:4px 12px;font-size:7px;letter-spacing:1px;text-transform:uppercase}
.hck{border:1px solid rgba(255,45,0,.5);color:#ff2d00;background:rgba(255,45,0,.08)}
.hcp{border:1px solid rgba(236,72,153,.5);color:#ec4899;background:rgba(236,72,153,.08)}
.hcku{border:1px solid rgba(147,51,234,.5);color:#9333ea;background:rgba(147,51,234,.08)}
.hcw{border:1px solid rgba(255,215,0,.5);color:#ffd700;background:rgba(255,215,0,.08)}
.hcs{border:1px solid rgba(0,245,255,.5);color:#00f5ff;background:rgba(0,245,255,.08)}
.hcco{border:1px solid rgba(200,255,0,.5);color:#c8ff00;background:rgba(200,255,0,.08)}
.hcgr{background:#c8ff00;color:#000;border:none}
.hcpo{background:#9333ea;color:#fff;border:none}
.hce{border:1px solid #333;color:#777}
.hero-title{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:clamp(40px,7vw,96px);line-height:.88;letter-spacing:-2px;color:#fff;margin-bottom:12px}
.hero-sub{font-size:10px;color:#888;display:flex;gap:20px;flex-wrap:wrap}
.hero-sub span{display:flex;align-items:center;gap:6px}

/* ═══ LAYOUT ═══ */
.layout{display:grid;grid-template-columns:1fr 380px;min-height:60vh}
.main-col{border-right:1px solid #1a1a2e}
.side-col{position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;background:#050510}
.side-col::-webkit-scrollbar{width:1px}
.side-col::-webkit-scrollbar-thumb{background:#1a1a2e}

/* ═══ META STRIP ═══ */
.meta-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #1a1a2e}
.ms-cell{padding:18px 20px;border-right:1px solid #1a1a2e}
.ms-cell:last-child{border-right:none}
.ms-l{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:#444;margin-bottom:6px}
.ms-v{font-size:12px;color:#e8e4d9;line-height:1.3}
.ms-v.red{color:#ff2d00}
.ms-v.volt{color:#c8ff00}

/* ═══ SECTIONS ═══ */
.section{padding:32px 40px;border-bottom:1px solid #1a1a2e}
.sec-label{font-size:7px;letter-spacing:4px;text-transform:uppercase;color:#ff2d00;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.sec-label::before{content:'';width:20px;height:1px;background:#ff2d00;flex-shrink:0}
.desc-text{font-size:11px;line-height:2;color:#888}

/* ═══ MAP ═══ */
.map-box{height:220px;background:#070710;border:1px solid #1a1a2e;position:relative;overflow:hidden;cursor:none}
.map-grid{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,45,0,.025) 0,rgba(255,45,0,.025) 1px,transparent 1px,transparent 28px),repeating-linear-gradient(90deg,rgba(255,45,0,.025) 0,rgba(255,45,0,.025) 1px,transparent 1px,transparent 28px)}
.map-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%)}
.map-pin-dot{width:14px;height:14px;background:#ff2d00;border-radius:50%;border:3px solid #fff;animation:ping 2s infinite;margin:0 auto}
.map-pin-line{width:1px;height:22px;background:#ff2d00;margin:0 auto}
.map-addr{position:absolute;bottom:14px;left:14px;font-size:8px;letter-spacing:1px;color:#444}
.map-cta{position:absolute;bottom:14px;right:14px;background:#ff2d00;color:#fff;border:none;padding:8px 16px;font-family:'DM Mono',monospace;font-size:7px;letter-spacing:2px;text-transform:uppercase;cursor:none}

/* ═══ BEWERTUNGEN ═══ */
.rating-header{display:flex;align-items:center;gap:20px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #1a1a2e}
.rating-big{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:72px;color:#ff2d00;line-height:1}
.rating-stars{display:flex;gap:4px;margin-bottom:4px}
.star{font-size:16px}
.star.on{color:#ff2d00}
.star.off{color:#1a1a2e}
.rating-count{font-size:9px;color:#555;letter-spacing:1px}
.rating-bars{flex:1}
.rb-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rb-n{font-size:8px;color:#555;width:6px}
.rb-track{flex:1;height:3px;background:#1a1a2e}
.rb-fill{height:100%;background:#ff2d00;transition:width 1s ease}
.rb-pct{font-size:7px;color:#444;width:28px;text-align:right}

/* REVIEW CARDS */
.review-list{display:flex;flex-direction:column;gap:12px}
.review-card{border:1px solid #1a1a2e;padding:18px;transition:border-color .2s}
.review-card:hover{border-color:#333}
.rv-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rv-avatar{width:36px;height:36px;border-radius:50%;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.rv-name{font-size:10px;color:#e8e4d9;margin-bottom:3px}
.rv-date{font-size:7px;color:#444;letter-spacing:1px}
.rv-stars{display:flex;gap:3px;margin-left:auto}
.rv-star{font-size:11px}
.rv-text{font-size:10px;line-height:1.8;color:#777}
.rv-kreis{display:inline-block;background:#1a1a2e;padding:2px 7px;font-size:7px;color:#555;margin-top:8px}

/* WRITE REVIEW */
.write-review{border:1px solid #1a1a2e;padding:20px;margin-top:16px;background:#050510}
.wr-label{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:14px}
.wr-stars{display:flex;gap:8px;margin-bottom:14px}
.wr-star{font-size:24px;color:#1a1a2e;cursor:none;transition:color .2s}
.wr-star:hover{color:#ff2d00}
.wr-star.sel{color:#ff2d00}
.wr-input{width:100%;background:#0a0a14;border:1px solid #1a1a2e;color:#e8e4d9;padding:14px;font-family:'DM Mono',monospace;font-size:10px;line-height:1.7;resize:none;outline:none;min-height:100px;transition:border-color .2s;margin-bottom:10px}
.wr-input:focus{border-color:#ff2d00}
.wr-input::placeholder{color:#333}
.wr-btn{background:#ff2d00;color:#fff;border:none;padding:0 24px;height:48px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:none;transition:background .2s;width:100%}
.wr-btn:hover{background:#ff4020}
.wr-login-hint{font-size:8px;color:#333;margin-top:8px;text-align:center}

/* ÄHNLICHE */
.sim-grid{display:flex;flex-direction:column;gap:8px}
.sim-card{display:grid;grid-template-columns:60px 1fr 70px;border:1px solid #1a1a2e;cursor:none;transition:border-color .2s;text-decoration:none}
.sim-card:hover{border-color:#ff2d00}
.sim-time{padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #1a1a2e}
.sim-th{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:22px;color:#e8e4d9;line-height:1}
.sim-tm{font-size:6px;color:#555;letter-spacing:1px}
.sim-body{padding:12px 14px}
.sim-title{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:16px;color:#e8e4d9;margin-bottom:4px;line-height:1.1}
.sim-venue{font-size:7px;color:#555}
.sim-img{position:relative;overflow:hidden;background:#0a0a14}
.sim-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(60%);display:block;transition:filter .3s}
.sim-card:hover .sim-img img{filter:grayscale(10%)}
.sim-iph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#1a1a2e}

/* ═══ SIDEBAR ═══ */
.side-top{padding:24px}
.side-ticket{background:#ff2d00;color:#fff;border:none;height:60px;line-height:60px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:none;width:100%;text-align:center;transition:background .2s;text-decoration:none;display:block;margin-bottom:10px}
.side-ticket:hover{background:#ff4020}
.side-ticket.gr{background:#c8ff00;color:#000}
.side-sec{background:transparent;color:#777;border:1px solid #1a1a2e;height:52px;line-height:52px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:none;width:100%;text-align:center;transition:all .2s;margin-bottom:8px;display:block;text-decoration:none}
.side-sec:hover{color:#e8e4d9;border-color:#444}
.side-div{height:1px;background:#1a1a2e;margin:16px 0}

/* SIDE META */
.side-meta{padding:0 24px}
.sm-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid #0d0d1e;font-size:9px}
.sm-l{color:#444;letter-spacing:1px;text-transform:uppercase;font-size:7px}
.sm-v{color:#e8e4d9}
.sm-v.red{color:#ff2d00}
.sm-v.volt{color:#c8ff00}

/* PHASE 5 */
.p5-box{padding:20px 24px;border-top:1px solid #1a1a2e;background:#03030d}
.p5-lab{font-size:7px;letter-spacing:2px;color:#00f5ff;text-transform:uppercase;margin-bottom:12px}
.p5-big{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:28px;color:#e8e4d9;margin-bottom:8px;line-height:1}
.p5-desc{font-size:9px;color:#555;line-height:1.7;margin-bottom:14px}
.p5-avs{display:flex;margin-bottom:6px}
.p5-av{width:30px;height:30px;border-radius:50%;border:2px solid #03030d;background:#1a1a2e;display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-left:-7px}
.p5-av:first-child{margin-left:0}
.p5-cnt{font-size:8px;color:#444;letter-spacing:1px;margin-bottom:14px}
.p5-btn{background:transparent;border:1px solid rgba(0,245,255,.25);color:#00f5ff;height:52px;line-height:52px;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:none;width:100%;transition:all .2s;display:block;text-align:center;margin-bottom:8px}
.p5-btn:hover{background:rgba(0,245,255,.06)}
.p5-btn.dates{border-color:rgba(236,72,153,.3);color:#ec4899}
.p5-btn.dates:hover{background:rgba(236,72,153,.06)}

/* PHASE 6 */
.p6-box{padding:20px 24px;border-top:1px solid #1a001a}
.p6-lab{font-size:7px;letter-spacing:2px;color:#9333ea;text-transform:uppercase;margin-bottom:12px}
.p6-item{display:flex;gap:12px;align-items:flex-start;padding:10px;border:1px solid rgba(147,51,234,.1);margin-bottom:6px;background:rgba(147,51,234,.02)}
.p6-item:last-child{margin-bottom:0}
.p6-icon{font-size:16px;flex-shrink:0}
.p6-text{font-size:8px;color:#555;line-height:1.6}
.p6-text strong{color:#9333ea;display:block;font-size:7px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}

/* SHARE */
.share-box{padding:20px 24px;border-top:1px solid #1a1a2e}
.share-lab{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:#333;margin-bottom:12px}
.share-row{display:flex;gap:6px}
.share-btn{flex:1;height:44px;line-height:44px;background:transparent;border:1px solid #1a1a2e;color:#555;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;cursor:none;text-align:center;transition:all .2s}
.share-btn:hover{border-color:#333;color:#e8e4d9}

/* LOADING */
.load-page{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.load-big{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:80px;color:#0d0d1e;animation:blink 1.2s infinite}

@keyframes ping{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}

@media(max-width:960px){
  .layout{grid-template-columns:1fr}
  .side-col{position:static;height:auto}
  .meta-strip{grid-template-columns:repeat(2,1fr)}
  .hero-content{padding:0 16px 24px}
  .hero-time{top:12px;right:16px;padding:10px 16px}
  .ht-h{font-size:36px}
  .live-badge,.soldout-badge{top:12px;left:16px}
  .section{padding:24px 16px}
  .side-top{padding:16px}
  .side-meta{padding:0 16px}
  .p5-box,.p6-box,.share-box{padding:16px}
  nav{padding:12px 16px}
}
</style>
</head>
<body>
<div id="cur"></div><div id="cur2"></div>
<div class="scan"></div>

<nav>
  <a href="index.html" class="logo">STADTPULS</a>
  <a href="events.html" class="nav-back">← ZURÜCK ZU EVENTS</a>
</nav>

<div id="page"></div>

<script>
const SU='https://pnynkzrqnfoshojqfqxn.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBueW5renJxbmZvc2hvanFmcXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTg3NDEsImV4cCI6MjA5MTI5NDc0MX0.W3cOPU7lQKimHIYPc7ISuZGmOeV20GB3DEW-QdDJXZQ';

const c1=document.getElementById('cur'),c2=document.getElementById('cur2');
document.addEventListener('mousemove',e=>{c1.style.left=e.clientX+'px';c1.style.top=e.clientY+'px';setTimeout(()=>{c2.style.left=e.clientX+'px';c2.style.top=e.clientY+'px'},80);});

const DAYS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const KN={konzert:'Konzert',comedy:'Comedy',party:'Party',workshop:'Workshop',sport:'Sport',markt:'Markt',kultur:'Kultur',event:'Event'};
const KC={konzert:'hck',comedy:'hcco',party:'hcp',kultur:'hcku',workshop:'hcw',sport:'hcs',markt:'hcgr',event:'hce'};
const KE={konzert:'🎵',comedy:'😂',party:'🎉',workshop:'🎯',sport:'⚡',markt:'🛍',kultur:'🎨',event:'⚡'};

// Fake reviews — Phase 5 wird echte aus Supabase laden
const FAKE_REVIEWS=[
  {name:'Lena M.',kreis:4,stars:5,text:'Mega geil! Würd ich sofort wieder gah. Die Atmosphäre war unglaublich und die Organisation top.',date:'Gestern',emoji:'🦊'},
  {name:'Marco B.',kreis:5,stars:4,text:'Sehr gutes Event, Zürich kann das. Einzig die Wartezeit am Eingang war lang.',date:'Vor 3 Tagen',emoji:'🐺'},
  {name:'Sara K.',kreis:1,stars:5,text:'Absolut empfehlenswert. Einer der besten Abende in Züri seit langem!',date:'Vor einer Woche',emoji:'🦋'},
];

function uhr(s){return s?s.substring(0,5):'--:--';}
function gk(ev){
  const t=((ev.titel||'')+(ev.beschreibung||'')).toLowerCase();
  if(/konzert|band|jazz|orchestra|chor|oper|musical/.test(t))return'konzert';
  if(/comedy|kabarett|stand.?up/.test(t))return'comedy';
  if(/party|disco|dj|rave|techno|house/.test(t))return'party';
  if(/workshop|kurs|vortrag|lesung|führung|yoga/.test(t))return'workshop';
  if(/sport|lauf|marathon|turnier/.test(t))return'sport';
  if(/markt|flohmarkt|messe/.test(t))return'markt';
  if(/museum|galerie|ausstellung|theater|kino|vernissage/.test(t))return'kultur';
  return'event';
}
function isDates(ev){
  const t=((ev.titel||'')+(ev.beschreibung||'')).toLowerCase();
  return/single|date|flirt|kennenlernen|speed.?dating|afterwork|apéro|tanzen|salsa|yoga/.test(t);
}
function stars(n,total=5){
  return Array.from({length:total},(_,i)=>`<span class="star ${i<n?'on':'off'}">${i<n?'★':'☆'}</span>`).join('');
}

async function load(){
  document.getElementById('page').innerHTML=`<div class="load-page"><div class="load-big">⚡</div><div style="font-size:8px;letter-spacing:3px;color:#111;text-transform:uppercase">Event wird geladen...</div></div>`;

  const params=new URLSearchParams(window.location.search);
  const id=params.get('id')||params.get('slug');
  if(!id){return showErr('Kein Event angegeben');}

  try{
    let r=await fetch(SU+'/rest/v1/eventfrog_events?ef_id=eq.'+encodeURIComponent(id)+'&limit=1',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
    let data=await r.json();
    if(!data.length){
      r=await fetch(SU+'/rest/v1/eventfrog_events?id=eq.'+encodeURIComponent(id)+'&limit=1',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
      data=await r.json();
    }
    if(!data.length)return showErr('Event nicht gefunden');
    const ev=data[0];ev._k=gk(ev);

    // Ähnliche Events — gleiche Kategorie
    const simR=await fetch(SU+'/rest/v1/eventfrog_events?aktiv=eq.true&datum_start=gte.'+new Date().toISOString().split('T')[0]+'&limit=6&order=datum_start.asc',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
    const simData=(await simR.json()).filter(e=>e.id!==ev.id).slice(0,3);

    // Events am gleichen Venue
    let venueData=[];
    if(ev.venue_name){
      const vr=await fetch(SU+'/rest/v1/eventfrog_events?aktiv=eq.true&venue_name=eq.'+encodeURIComponent(ev.venue_name)+'&datum_start=gte.'+new Date().toISOString().split('T')[0]+'&order=datum_start.asc&limit=5',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
      venueData=(await vr.json()).filter(e=>e.id!==ev.id).slice(0,4);
    }

    render(ev,simData,venueData);
  }catch(e){showErr('Verbindung fehlgeschlagen');}
}

function render(ev,similar){
  const k=ev._k||'event';
  const isG=ev.eintritt_typ==='kostenlos';
  const d=new Date(ev.datum_start+'T12:00:00');
  const dateStr=DAYS[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]+' 2026';
  const h=uhr(ev.uhrzeit_start);
  const em=KE[k];
  const eid=ev.ef_id||ev.id;
  const showDates=isDates(ev);

  // isLive — heute + jetzt
  const now=new Date();
  const isLive=ev.datum_start===now.toISOString().split('T')[0]&&
    h!=='--:--'&&parseInt(h)<=now.getHours()&&now.getHours()<parseInt(h)+4;

  document.title=ev.titel+' — Event Zürich | Stadtpuls';

  document.getElementById('page').innerHTML=`

  <!-- HERO -->
  <div class="hero">
    ${ev.bild_url
      ?`<img class="hero-img" src="${ev.bild_url}" alt="${ev.titel}" onerror="this.outerHTML='<div class=hero-ph>${em}</div>'">`
      :`<div class="hero-ph">${em}</div>`}
    <div class="hero-grad"></div>

    ${isLive
      ?`<div class="live-badge"><div class="live-dot"></div><div class="live-txt">LÄUFT GRAD JETZT</div></div>`
      :''}

    <div class="hero-time">
      <span class="ht-h">${h}</span>
      <span class="ht-l">UHR</span>
    </div>

    <div class="hero-content">
      <div class="hero-chips">
        <span class="hc ${KC[k]}">${KN[k]}</span>
        ${isG?'<span class="hc hcgr">Gratis</span>':''}
        ${ev.popup?'<span class="hc hcpo">Pop-Up</span>':''}
        ${ev.kreis?`<span class="hc hce">Kreis ${ev.kreis}</span>`:''}
        ${showDates?'<span class="hc" style="border:1px solid rgba(236,72,153,.5);color:#ec4899;background:rgba(236,72,153,.08)">💘 Dates</span>':''}
      </div>
      <h1 class="hero-title">${ev.titel}</h1>
      <div class="hero-sub">
        <span>📅 ${dateStr}</span>
        <span>⏰ ${h} Uhr</span>
        ${ev.venue_name?`<span>📍 ${ev.venue_name}</span>`:''}
      </div>
    </div>
  </div>

  <!-- META STRIP -->
  <div class="meta-strip">
    <div class="ms-cell"><div class="ms-l">Datum</div><div class="ms-v">${dateStr}</div></div>
    <div class="ms-cell"><div class="ms-l">Uhrzeit</div><div class="ms-v">${h} Uhr</div></div>
    <div class="ms-cell"><div class="ms-l">Ort</div><div class="ms-v">${ev.venue_name||'Zürich'}</div></div>
    <div class="ms-cell"><div class="ms-l">Eintritt</div><div class="ms-v ${isG?'volt':''}">${isG?'KOSTENLOS':'KOSTENPFLICHTIG'}</div></div>
  </div>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- MAIN -->
    <div class="main-col">

      <!-- BESCHREIBUNG -->
      ${ev.beschreibung?`
      <div class="section">
        <div class="sec-label">ÜBER DEN EVENT</div>
        <div class="desc-text">${ev.beschreibung}</div>
      </div>`:''}

      <!-- KARTE -->
      <div class="section">
        <div class="sec-label">LOCATION</div>
        <div class="map-box" onclick="window.open('https://maps.google.com/?q=${encodeURIComponent((ev.adresse||'')+' '+(ev.venue_name||'')+(ev.plz?' '+ev.plz:''))}','_blank')">
          <div class="map-grid"></div>
          <div class="map-center">
            <div class="map-pin-dot"></div>
            <div class="map-pin-line"></div>
          </div>
          <div class="map-addr">${ev.venue_name||''}${ev.adresse?' · '+ev.adresse:''}${ev.plz?' · '+ev.plz:''}</div>
          <button class="map-cta">📍 ROUTE ÖFFNE</button>
        </div>
      </div>

      <!-- BEWERTUNGEN -->
      <div class="section">
        <div class="sec-label">BEWERTUNGEN</div>

        <!-- RATING OVERVIEW -->
        <div class="rating-header">
          <div>
            <div class="rating-big">4.3</div>
            <div class="rating-stars">${stars(4)}</div>
            <div class="rating-count">3 Bewertungen · Phase 5 live</div>
          </div>
          <div class="rating-bars">
            <div class="rb-row"><div class="rb-n">5</div><div class="rb-track"><div class="rb-fill" style="width:67%"></div></div><div class="rb-pct">67%</div></div>
            <div class="rb-row"><div class="rb-n">4</div><div class="rb-track"><div class="rb-fill" style="width:22%"></div></div><div class="rb-pct">22%</div></div>
            <div class="rb-row"><div class="rb-n">3</div><div class="rb-track"><div class="rb-fill" style="width:11%"></div></div><div class="rb-pct">11%</div></div>
            <div class="rb-row"><div class="rb-n">2</div><div class="rb-track"><div class="rb-fill" style="width:0%"></div></div><div class="rb-pct">0%</div></div>
            <div class="rb-row"><div class="rb-n">1</div><div class="rb-track"><div class="rb-fill" style="width:0%"></div></div><div class="rb-pct">0%</div></div>
          </div>
        </div>

        <!-- REVIEWS -->
        <div class="review-list">
          ${FAKE_REVIEWS.map(rv=>`
          <div class="review-card">
            <div class="rv-header">
              <div class="rv-avatar">${rv.emoji}</div>
              <div>
                <div class="rv-name">${rv.name}</div>
                <div class="rv-date">${rv.date}</div>
              </div>
              <div class="rv-stars">${stars(rv.stars).replace(/class="star/g,'class="rv-star').replace(/★|☆/g,s=>s==='★'?'★':'☆')}</div>
            </div>
            <div class="rv-text">${rv.text}</div>
            <div class="rv-kreis">Kreis ${rv.kreis}</div>
          </div>`).join('')}
        </div>

        <!-- WRITE REVIEW -->
        <div class="write-review">
          <div class="wr-label">DINI BEWERTUNG — Phase 5 Login nötig</div>
          <div class="wr-stars" id="wr-stars">
            ${[1,2,3,4,5].map(i=>`<span class="wr-star" onclick="setStar(${i})">☆</span>`).join('')}
          </div>
          <textarea class="wr-input" placeholder="Was hesch du erlebt? Sag öis..." disabled></textarea>
          <button class="wr-btn" onclick="alert('Phase 5 — Login nötig!')">BEWERTUNG ABSCHICKE — LOGIN NÖTIG</button>
          <div class="wr-login-hint">Nur eingeloggte Stadtpulser können bewerten</div>
        </div>
      </div>

      <!-- ÄHNLICHE EVENTS -->
      ${similar.length?`
      <div class="section">
        <div class="sec-label">ÄHNLICHE EVENTS</div>
        <div class="sim-grid">
          ${similar.map(s=>{
            const sk=gk(s);const sh=uhr(s.uhrzeit_start);const sd=new Date(s.datum_start+'T12:00:00');
            return`<a href="event-profil.html?id=${s.ef_id||s.id}" class="sim-card">
              <div class="sim-time"><div class="sim-th">${sh.split(':')[0]}</div><div class="sim-tm">${sh.split(':')[1]}</div></div>
              <div class="sim-body">
                <div class="sim-title">${s.titel}</div>
                <div class="sim-venue">${DAYS[sd.getDay()]} · ${sd.getDate()}. ${MONTHS[sd.getMonth()]}${s.venue_name?' · '+s.venue_name:''}</div>
              </div>
              <div class="sim-img">${s.bild_url?`<img src="${s.bild_url}" alt="${s.titel}" onerror="this.parentElement.innerHTML='<div class=sim-iph>${KE[sk]}</div>'">`:`<div class="sim-iph">${KE[sk]}</div>`}</div>
            </a>`;
          }).join('')}
        </div>
      </div>`:''}

    </div>

    <!-- SIDEBAR -->
    <div class="side-col">
      <div class="side-top">
        ${ev.ticket_url&&!isG
          ?`<a href="${ev.ticket_url}" target="_blank" class="side-ticket">🎟 TICKET KAUFE</a>`
          :isG?'<div class="side-ticket gr">✓ GRATIS EINTRITT</div>':''}
        <a href="event-profil.html?id=${eid}" class="side-sec">📄 VOLLSTÄNDIGES PROFIL</a>
        <button class="side-sec" onclick="window.open('https://maps.google.com/?q=${encodeURIComponent(ev.adresse||ev.venue_name||'Zürich')}','_blank')">📍 AUF KARTE</button>
        <button class="side-sec" onclick="navigator.share?navigator.share({title:'${ev.titel.replace(/'/g,'').substring(0,40)}',url:location.href}):navigator.clipboard&&navigator.clipboard.writeText(location.href)">↗ TEILE</button>
        <button class="side-sec" onclick="alert('Phase 5 — Kalender kommt!')">📅 IN KALENDER</button>
      </div>

      <!-- META -->
      <div class="side-meta">
        <div class="sm-row"><span class="sm-l">Datum</span><span class="sm-v">${dateStr}</span></div>
        <div class="sm-row"><span class="sm-l">Uhrzeit</span><span class="sm-v">${h} Uhr</span></div>
        ${ev.venue_name?`<div class="sm-row"><span class="sm-l">Ort</span><span class="sm-v">${ev.venue_name}</span></div>`:''}
        ${ev.adresse?`<div class="sm-row"><span class="sm-l">Adresse</span><span class="sm-v">${ev.adresse}</span></div>`:''}
        ${ev.kreis?`<div class="sm-row"><span class="sm-l">Kreis</span><span class="sm-v red">Kreis ${ev.kreis}</span></div>`:''}
        <div class="sm-row"><span class="sm-l">Eintritt</span><span class="sm-v ${isG?'volt':''}">${isG?'KOSTENLOS':'KOSTENPFLICHTIG'}</span></div>
      </div>

      <!-- PHASE 5 -->
      <div class="p5-box">
        <div class="p5-lab">⚡ PHASE 5 — COMMUNITY</div>
        <div class="p5-big">WER GEHT NOCH?</div>
        <div class="p5-desc">Speichere Events · Sieh wer noch hingeht · Spontan-Gruppe · Kreis-Freunde finden</div>
        <div class="p5-avs">
          <div class="p5-av">🦊</div><div class="p5-av">🐺</div><div class="p5-av">🦋</div><div class="p5-av">🦁</div>
          <div class="p5-av" style="background:rgba(0,245,255,.08);color:#00f5ff;font-size:8px;font-family:'DM Mono',monospace">+?</div>
        </div>
        <div class="p5-cnt">? Stadtpulser gehen — Login um zu sehen</div>
        <button class="p5-btn" onclick="alert('Phase 5 — Login kommt!')">♥ ICH GEHE — LOGIN NÖTIG</button>
        <button class="p5-btn" onclick="alert('Phase 5 — Community kommt!')">👥 WER GEHT NOCH?</button>
        ${showDates?`<a href="dating.html" class="p5-btn dates" style="text-decoration:none;display:block;text-align:center;height:52px;line-height:52px">💘 PEOPLE & DATES →</a>`:''}
      </div>

      <!-- PHASE 6 -->
      <div class="p6-box">
        <div class="p6-lab">🔮 PHASE 6 — KI</div>
        <div class="p6-item"><div class="p6-icon">🎯</div><div class="p6-text"><strong>Für dich empfohlen</strong>KI lernt deine Vorlieben automatisch</div></div>
        <div class="p6-item"><div class="p6-icon">⚡</div><div class="p6-text"><strong>Spontan-Modus</strong>«2h · Kreis 4 · gratis» → KI baut deinen Abend</div></div>
        <div class="p6-item"><div class="p6-icon">🎟</div><div class="p6-text"><strong>Ticketcorner</strong>Direkt buchen ohne Stadtpuls zu verlassen</div></div>
      </div>

      <!-- SHARE -->
      <div class="share-box">
        <div class="share-lab">EVENT TEILE</div>
        <div class="share-row">
          <button class="share-btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href)">🔗 LINK</button>
          <button class="share-btn" onclick="window.open('https://api.whatsapp.com/send?text=${encodeURIComponent(ev.titel+' '+location.href)}','_blank')">💬 WA</button>
          <button class="share-btn" onclick="window.open('mailto:?subject=${encodeURIComponent(ev.titel)}&body=${encodeURIComponent(location.href)}','_blank')">✉️ MAIL</button>
        </div>
      </div>
    </div>
  </div>`;

  // Star interaction
  let selStar=0;
  window.setStar=function(n){
    selStar=n;
    document.querySelectorAll('.wr-star').forEach((s,i)=>{
      s.textContent=i<n?'★':'☆';
      s.classList.toggle('sel',i<n);
    });
  };
}

function showErr(msg){
  document.getElementById('page').innerHTML=`
    <div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:40px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-size:72px;color:#111">404</div>
      <div style="font-size:9px;letter-spacing:3px;color:#333;text-transform:uppercase">${msg}</div>
      <a href="events.html" style="background:#ff2d00;color:#fff;padding:0 32px;height:52px;line-height:52px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;display:inline-block;margin-top:8px">← ZURÜCK ZU EVENTS</a>
    </div>`;
}

load();
</script>
</body>
</html>
